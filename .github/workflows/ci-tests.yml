# Suite completa en cada push: cualquier error en cualquier modulo se detecta
# antes de llegar a una release. Los tests de Swing necesitan display: xvfb.
name: Tests

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Suite completa (display virtual para los tests de Swing)
        run: xvfb-run -a mvn -B test

  # E2E con servidor de Minecraft REAL y jugador-bot por protocolo: el flujo
  # entero de hostear (instalar, arrancar, entrar, salir, backup, candado)
  e2e-minecraft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Flujo completo con server real (perfil e2e-mc)
        run: xvfb-run -a mvn -B -Pe2e-mc test -Dtest=MinecraftServerE2ETest
