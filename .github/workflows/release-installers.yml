# Construye los instaladores de cada plataforma cuando se publica una release
# y los adjunta a la propia release: DMG (macOS), EXE (Windows) y JAR portable.
# El update checker de la app elige el asset segun el sistema del usuario.
name: Release installers

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag de la release (p. ej. v1.7.2-p2p)"
        required: true

permissions:
  contents: write

jobs:
  # Gate: si la suite falla en cualquier modulo, NO se construye ni se adjunta
  # ningun instalador — el error se detecta en el despliegue, no en casa de nadie
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Resolver tag
        id: tag
        shell: bash
        env:
          RAW_TAG: ${{ github.event.release.tag_name || github.event.inputs.tag }}
        run: |
          if ! printf "%s" "$RAW_TAG" | grep -Eq "^v?[0-9]+(\.[0-9]+)*(-[A-Za-z0-9.-]+)?$"; then
            echo "Tag no valido: $RAW_TAG" >&2
            exit 1
          fi
          echo "tag=$RAW_TAG" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Suite completa (display virtual para los tests de Swing)
        shell: bash
        run: xvfb-run -a mvn -B test

  installers:
    needs: tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            kind: jar
          - os: macos-latest
            kind: dmg
          - os: windows-latest
            kind: exe
    runs-on: ${{ matrix.os }}
    steps:
      - name: Resolver tag y version
        id: tag
        shell: bash
        env:
          RAW_TAG: ${{ github.event.release.tag_name || github.event.inputs.tag }}
        run: |
          if ! printf "%s" "$RAW_TAG" | grep -Eq "^v?[0-9]+(\.[0-9]+)*(-[A-Za-z0-9.-]+)?$"; then
            echo "Tag no valido: $RAW_TAG" >&2
            exit 1
          fi
          VERSION="${RAW_TAG#v}"
          VERSION="${VERSION%%-*}"
          echo "tag=$RAW_TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Compilar jar sombreado
        shell: bash
        run: mvn -B -q package -DskipTests

      - name: Preparar staging
        shell: bash
        run: |
          mkdir -p stage dist
          POM_VERSION=$(mvn -q -DforceStdout help:evaluate -Dexpression=project.version)
          cp "target/Endershare-$POM_VERSION.jar" stage/Endershare.jar

      - name: Instalador DMG (macOS)
        if: matrix.kind == 'dmg'
        shell: bash
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          jpackage --type dmg --name Endershare --app-version "$VERSION" \
            --icon packaging/Endershare.icns \
            --java-options "-Xmx192m" --java-options "-Xms16m" \
            --java-options "-XX:+UseSerialGC" \
            --java-options "-XX:MinHeapFreeRatio=10" --java-options "-XX:MaxHeapFreeRatio=30" \
            --java-options "-Xss768k" --java-options "-XX:MaxMetaspaceSize=128m" \
            --java-options "-XX:TieredStopAtLevel=1" \
            --input stage --main-jar Endershare.jar --main-class view.MainFrame --dest dist
          for built in dist/*.dmg; do
            [ "$built" = "dist/Endershare-$VERSION.dmg" ] || mv "$built" "dist/Endershare-$VERSION.dmg"
          done

      - name: Instalador EXE (Windows)
        if: matrix.kind == 'exe'
        shell: bash
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          # El upgrade-uuid FIJO (y el vendor original) hace que cada version
          # REEMPLACE a la anterior aunque el nombre visible haya cambiado a
          # Endershare: NO tocar ninguno de los dos
          jpackage --type exe --name Endershare --app-version "$VERSION" \
            --vendor P2PMSS --win-upgrade-uuid 61CF6467-CAD1-4F24-B033-3BD205D8D7CE \
            --icon packaging/Endershare.ico \
            --java-options "-Xmx192m" --java-options "-Xms16m" \
            --java-options "-XX:+UseSerialGC" \
            --java-options "-XX:MinHeapFreeRatio=10" --java-options "-XX:MaxHeapFreeRatio=30" \
            --java-options "-Xss768k" --java-options "-XX:MaxMetaspaceSize=128m" \
            --java-options "-XX:TieredStopAtLevel=1" \
            --input stage --main-jar Endershare.jar --main-class view.MainFrame \
            --win-shortcut --win-menu --win-per-user-install --dest dist
          for built in dist/*.exe; do
            [ "$built" = "dist/Endershare-$VERSION.exe" ] || mv "$built" "dist/Endershare-$VERSION.exe"
          done

      - name: Jar portable (cualquier sistema)
        if: matrix.kind == 'jar'
        shell: bash
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: cp stage/Endershare.jar "dist/Endershare-$VERSION.jar"

      - name: Adjuntar asset a la release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: gh release upload "$TAG" dist/Endershare-* --clobber
